<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lineage Viewer — Data Lineage Interactivo</title>

  <!-- Cytoscape.js + dagre layout — jsDelivr CDN (MIT license, actively maintained) -->
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #1f2328;
      background: #f7f8fa;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    #header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      min-height: 48px;
      flex-wrap: wrap;
    }

    #header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #1f2328;
      white-space: nowrap;
      margin-right: 4px;
    }

    /* ── Tabs ── */
    #tabs {
      display: flex;
      align-items: stretch;
      gap: 2px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .tab {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #57606a;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }

    .tab:hover:not(.tab-disabled) {
      color: #1f2328;
    }

    .tab.tab-active {
      color: #3b82d4;
      border-bottom-color: #3b82d4;
    }

    .tab.tab-disabled {
      color: #b0b8c1;
      cursor: not-allowed;
      font-style: italic;
    }

    /* ── Search ── */
    #search-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
    }

    #search-input {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      width: 200px;
      outline: none;
      background: #f7f8fa;
      color: #1f2328;
      transition: border-color 0.15s;
    }

    #search-input:focus {
      border-color: #3b82d4;
      background: #fff;
    }

    #search-count {
      font-size: 12px;
      color: #57606a;
      white-space: nowrap;
    }

    #btn-clear-search {
      background: none;
      border: none;
      cursor: pointer;
      color: #57606a;
      font-size: 15px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
    }

    #btn-clear-search:hover { color: #1f2328; }

    /* ── Main area ── */
    #main {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Graph container ── */
    #cy {
      flex: 1;
      min-width: 0;
      background: #ffffff;
    }

    /* ── Detail panel ── */
    #detail-panel {
      width: 300px;
      flex-shrink: 0;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #panel-header {
      padding: 12px 16px 8px;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }

    #panel-header h2 {
      font-size: 13px;
      font-weight: 600;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    #panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    #panel-empty {
      color: #57606a;
      font-size: 13px;
      margin-top: 8px;
    }

    .detail-table-name {
      font-size: 15px;
      font-weight: 700;
      color: #1f2328;
      word-break: break-all;
      margin-bottom: 6px;
    }

    .type-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-raw      { background: #d1d5db; color: #374151; }
    .badge-internal { background: #bfdbfe; color: #1e40af; }
    .badge-output   { background: #bbf7d0; color: #14532d; }

    .detail-section {
      margin-bottom: 12px;
    }

    .detail-section-label {
      font-size: 11px;
      font-weight: 600;
      color: #57606a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .detail-section-value {
      font-size: 13px;
      color: #1f2328;
    }

    .detail-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 3px;
    }

    .detail-list li {
      background: #f7f8fa;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 12px;
      color: #1f2328;
      cursor: pointer;
      transition: background 0.1s;
    }

    .detail-list li:hover {
      background: #e0e7ff;
      border-color: #3b82d4;
    }

    .detail-divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 10px 0;
    }

    /* ── Legend ── */
    #legend {
      padding: 10px 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 14px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #57606a;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .dot-raw      { background: #d1d5db; border: 1px solid #6b7280; }
    .dot-internal { background: #bfdbfe; border: 1px solid #3b82f6; }
    .dot-output   { background: #bbf7d0; border: 1px solid #16a34a; }

    /* ── Footer ── */
    #footer {
      text-align: center;
      font-size: 11px;
      color: #b0b8c1;
      padding: 5px;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- ══════════════ HEADER ══════════════ -->
  <div id="header">
    <h1>Lineage Viewer</h1>
    <div id="tabs"></div>
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="🔍 Buscar tabla..." autocomplete="off" spellcheck="false">
      <span id="search-count"></span>
      <button id="btn-clear-search" title="Limpiar búsqueda">✕</button>
    </div>
  </div>

  <!-- ══════════════ MAIN ══════════════ -->
  <div id="main">
    <div id="cy"></div>

    <div id="detail-panel">
      <div id="panel-header">
        <h2>Detalle del nodo</h2>
      </div>
      <div id="panel-body">
        <p id="panel-empty">Seleccioná un nodo para ver su detalle.</p>
      </div>
      <div id="legend">
        <div class="legend-item"><span class="legend-dot dot-raw"></span> Raw (input externo)</div>
        <div class="legend-item"><span class="legend-dot dot-internal"></span> Internal (intermedio)</div>
        <div class="legend-item"><span class="legend-dot dot-output"></span> Output (final)</div>
      </div>
    </div>
  </div>

  <!-- ══════════════ FOOTER ══════════════ -->
  <div id="footer">Made with IBM Bob</div>

<script>

  return { nodes, edges, nodeDetails };
}

// ═══════════════════════════════════════════════════════════════════════
//  APP STATE
// ═══════════════════════════════════════════════════════════════════════
let cy = null;
let currentModel = null;

// ═══════════════════════════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════════════════════════
function renderTabs(activeId) {
  const container = document.getElementById('tabs');
  container.innerHTML = '';
  MODELS.forEach(m => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (m.id === activeId ? ' tab-active' : '') + (m.disabled ? ' tab-disabled' : '');
    tab.textContent = m.label;
    tab.title = m.disabled ? 'Próximamente' : m.label;
    if (!m.disabled) {
      tab.addEventListener('click', () => { if (m.id !== currentModel) switchModel(m.id); });
    }
    container.appendChild(tab);
  });
}

function switchModel(modelId) {
  currentModel = modelId;
  const model = MODELS.find(m => m.id === modelId);
  renderTabs(modelId);
  clearSearch();
  clearPanel();
  initGraph(model.data);
}

// ═══════════════════════════════════════════════════════════════════════
//  GRAPH
// ═══════════════════════════════════════════════════════════════════════
function initGraph(data) {
  if (cy) { cy.destroy(); cy = null; }

  const elements = [
    ...data.nodes.map(n => ({
      data: { id: n.id, label: n.label, type: n.type }
    })),
    ...data.edges.map((e, i) => ({
      data: { id: 'e' + i, source: e.source, target: e.target, sql: e.sql }
    }))
  ];

  cytoscape.use(cytoscapeDagre);

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements,
    style: [
      {
        selector: 'node',
        style: {
          'label': 'data(label)',
          'text-valign': 'center',
          'text-halign': 'center',
          'font-size': '11px',
          'font-family': '-apple-system, Segoe UI, system-ui, sans-serif',
          'color': '#1f2937',
          'width': 'label',
          'height': '28px',
          'padding': '6px',
          'shape': 'roundrectangle',
          'border-width': '1.5px',
          'cursor': 'pointer'
        }
      },
      {
        selector: 'node[type="raw"]',
        style: {
          'background-color': '#d1d5db',
          'border-color': '#6b7280'
        }
      },
      {
        selector: 'node[type="internal"]',
        style: {
          'background-color': '#bfdbfe',
          'border-color': '#3b82f6'
        }
      },
      {
        selector: 'node[type="output"]',
        style: {
          'background-color': '#bbf7d0',
          'border-color': '#16a34a'
        }
      },
      {
        selector: 'edge',
        style: {
          'width': 1.5,
          'line-color': '#9ca3af',
          'target-arrow-color': '#9ca3af',
          'target-arrow-shape': 'triangle',
          'curve-style': 'bezier',
          'label': 'data(sql)',
          'font-size': '9px',
          'color': '#6b7280',
          'text-rotation': 'autorotate',
          'text-margin-y': -8,
          'text-overflow-wrap': 'anywhere',
          'text-max-width': '120px'
        }
      },
      // Dimmed state
      {
        selector: '.dimmed',
        style: {
          'opacity': 0.12
        }
      },
      // Highlighted node
      {
        selector: 'node.highlighted',
        style: {
          'border-width': '3px',
          'opacity': 1
        }
      },
      // Selected node (the one clicked)
      {
        selector: 'node.selected-node',
        style: {
          'border-width': '3px',
          'border-color': '#f59e0b',
          'background-color': '#fef3c7',
          'opacity': 1
        }
      },
      // Highlighted edge
      {
        selector: 'edge.highlighted',
        style: {
          'width': 2.5,
          'line-color': '#3b82d4',
          'target-arrow-color': '#3b82d4',
          'opacity': 1
        }
      }
    ],
    layout: {
      name: 'dagre',
      rankDir: 'LR',
      nodeSep: 40,
      rankSep: 110,
      edgeSep: 8,
      padding: 24,
      animate: false
    },
    minZoom: 0.05,
    maxZoom: 3,
    wheelSensitivity: 0.3
  });

  // ── Node click handler ──
  cy.on('tap', 'node', function(evt) {
    const node = evt.target;
    selectNode(node, data.nodeDetails);
  });

  // ── Background click → reset ──
  cy.on('tap', function(evt) {
    if (evt.target === cy) {
      resetHighlight();
      clearPanel();
    }
  });
}

function selectNode(node, nodeDetails) {
  resetHighlight();

  const neighborhood = node.neighborhood();
  const incomers = node.incomers();
  const outgoers = node.outgoers();

  // Dim everything, then highlight neighborhood
  cy.elements().addClass('dimmed');
  neighborhood.removeClass('dimmed').addClass('highlighted');
  node.removeClass('dimmed').removeClass('highlighted').addClass('selected-node');

  renderPanel(node, incomers, outgoers, nodeDetails);
}

function resetHighlight() {
  if (!cy) return;
  cy.elements().removeClass('dimmed').removeClass('highlighted').removeClass('selected-node');
}

// ═══════════════════════════════════════════════════════════════════════
//  DETAIL PANEL
// ═══════════════════════════════════════════════════════════════════════
function renderPanel(node, incomers, outgoers, nodeDetails) {
  const label = node.data('label');
  const type  = node.data('type');
  const detail = nodeDetails[label];

  const upstreamNodes  = incomers.nodes().map(n => n.data('label'));
  const downstreamNodes = outgoers.nodes().map(n => n.data('label'));

  const badgeClass = { raw: 'badge-raw', internal: 'badge-internal', output: 'badge-output' }[type] || 'badge-raw';
  const typeLabel  = { raw: 'Raw', internal: 'Internal', output: 'Output' }[type] || type;

  let html = `
    <div class="detail-table-name">${escHtml(label)}</div>
    <span class="type-badge ${badgeClass}">${typeLabel}</span>`;

  if (detail) {
    html += `
    <div class="detail-section">
      <div class="detail-section-label">SQL File</div>
      <div class="detail-section-value">${escHtml(detail.sqlFile)}</div>
    </div>`;

    if (detail.inputs && detail.inputs.length) {
      html += `
    <div class="detail-section">
      <div class="detail-section-label">Inputs (${detail.inputs.length})</div>
      <ul class="detail-list">${detail.inputs.map(i => `<li data-nav="${escHtml(i)}" title="Navegar a ${escHtml(i)}">${escHtml(i)}</li>`).join('')}</ul>
    </div>`;
    }

    if (detail.ctes && detail.ctes.length) {
      html += `
    <div class="detail-section">
      <div class="detail-section-label">CTEs (${detail.ctes.length})</div>
      <ul class="detail-list">${detail.ctes.map(c => `<li>${escHtml(c)}</li>`).join('')}</ul>
    </div>`;
    }
    html += '<hr class="detail-divider">';
  }

  if (upstreamNodes.length) {
    html += `
    <div class="detail-section">
      <div class="detail-section-label">Upstream directo (${upstreamNodes.length})</div>
      <ul class="detail-list">${upstreamNodes.map(n => `<li data-nav="${escHtml(n)}" title="Navegar a ${escHtml(n)}">${escHtml(n)}</li>`).join('')}</ul>
    </div>`;
  }

  if (downstreamNodes.length) {
    html += `
    <div class="detail-section">
      <div class="detail-section-label">Downstream directo (${downstreamNodes.length})</div>
      <ul class="detail-list">${downstreamNodes.map(n => `<li data-nav="${escHtml(n)}" title="Navegar a ${escHtml(n)}">${escHtml(n)}</li>`).join('')}</ul>
    </div>`;
  }

  if (!detail && !upstreamNodes.length && !downstreamNodes.length) {
    html += '<p style="color:#57606a;font-size:13px;">No hay conexiones registradas para este nodo.</p>';
  }

  const body = document.getElementById('panel-body');
  body.innerHTML = html;

  // Click en chips del panel → navegar al nodo
  body.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => {
      const targetLabel = el.getAttribute('data-nav');
      navigateToLabel(targetLabel);
    });
  });
}

function clearPanel() {
  document.getElementById('panel-body').innerHTML =
    '<p id="panel-empty">Seleccioná un nodo para ver su detalle.</p>';
}

function navigateToLabel(label) {
  if (!cy) return;
  const model = MODELS.find(m => m.id === currentModel);
  const target = cy.nodes().filter(n => n.data('label') === label).first();
  if (target.length) {
    cy.animate({ fit: { eles: target, padding: 120 } }, { duration: 400 });
    selectNode(target, model.data.nodeDetails);
  }
}

// ═══════════════════════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════════════════════
function initSearch() {
  const input  = document.getElementById('search-input');
  const count  = document.getElementById('search-count');
  const btnClr = document.getElementById('btn-clear-search');

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { resetHighlight(); count.textContent = ''; return; }
    if (!cy) return;

    const matched = cy.nodes().filter(n => n.data('label').toLowerCase().includes(q));
    if (!matched.length) { count.textContent = '0 resultados'; resetHighlight(); return; }

    count.textContent = matched.length + (matched.length === 1 ? ' resultado' : ' resultados');
    cy.elements().addClass('dimmed');
    matched.removeClass('dimmed').addClass('highlighted');

    if (matched.length === 1) {
      cy.animate({ fit: { eles: matched, padding: 120 } }, { duration: 400 });
      const model = MODELS.find(m => m.id === currentModel);
      selectNode(matched.first(), model.data.nodeDetails);
    }
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = input.value.trim().toLowerCase();
      if (!q || !cy) return;
      const matched = cy.nodes().filter(n => n.data('label').toLowerCase().includes(q));
      if (matched.length) {
        cy.animate({ fit: { eles: matched, padding: 80 } }, { duration: 400 });
        if (matched.length === 1) {
          const model = MODELS.find(m => m.id === currentModel);
          selectNode(matched.first(), model.data.nodeDetails);
        }
      }
    }
  });

  btnClr.addEventListener('click', clearSearch);
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-count').textContent = '';
  resetHighlight();
}

// ═══════════════════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════════════════
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ═══════════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  initSearch();
  switchModel('ch');
});
</script>
